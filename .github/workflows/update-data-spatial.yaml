name: update-data-spatial

on:
  workflow_dispatch:
  schedule:
    - cron: "20 18 * * 0"

permissions:
  contents: write
  pull-requests: write

jobs:
  update-data:
    uses: ./.github/workflows/update-data-template.yaml
    secrets: inherit
    with:
      run_scripts: |
        Rscript -e 'source("visium-dlpfc-spatial.R")'
        Rscript -e 'source("cell2location-paired.R")'
      bioc_packages: "SpatialExperiment,STexampleData"
      add_paths: |
        data/visium-dlpfc-sub.rds
        data/dlpfpc-spatial.rds
        data/dlpfpc-ref.rds
      branch: update-data-spatial
      title: "chore(data): update spatial bookdown caches"
      body: "Update cached spatial data generated from bookdown/data-raw."
