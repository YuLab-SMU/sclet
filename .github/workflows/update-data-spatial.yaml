name: update-data-spatial

on:
  workflow_dispatch:
  schedule:
    - cron: "20 18 * * 0"

permissions:
  contents: write
  pull-requests: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout docs branch
        uses: actions/checkout@v4
        with:
          ref: docs
          path: docs-src

      - name: Checkout package source
        uses: actions/checkout@v4
        with:
          ref: devel
          path: sclet-src

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libhdf5-dev \
            libpng-dev \
            libjpeg-dev \
            libtiff5-dev \
            libfreetype6-dev \
            libfontconfig1-dev

      - name: Install dependencies
        run: |
          Rscript -e 'install.packages(c("remotes", "BiocManager"))'
          Rscript -e 'BiocManager::install(c("Rhdf5lib", "rhdf5filters", "rhdf5", "h5mread", "HDF5Array", "SpatialExperiment", "STexampleData", "SingleCellExperiment", "SummarizedExperiment", "scuttle"), ask = FALSE, update = FALSE, dependencies = TRUE)'
          Rscript -e 'remotes::install_github(c("YuLab-SMU/ggsc", "YuLab-SMU/yulab.utils", "YuLab-SMU/fanyi"), upgrade = "never")'
          Rscript -e 'remotes::install_deps("sclet-src", dependencies = c("Depends", "Imports", "LinkingTo"), upgrade = "never")'
          R CMD INSTALL sclet-src

      - name: Build spatial caches
        run: |
          set -euo pipefail
          ws="$GITHUB_WORKSPACE"
          bookdir=$(dirname "$(find "$ws/docs-src" -maxdepth 6 -name '_bookdown.yml' -print -quit)")
          mkdir -p "$bookdir/data"
          cd "$ws/sclet-src/bookdown/data-raw"
          Rscript -e 'source("visium-dlpfc-spatial.R")'
          Rscript -e 'source("cell2location-paired.R")'
          cp -f "$ws/sclet-src/bookdown/data/visium-dlpfc-sub.rds" "$bookdir/data/"
          cp -f "$ws/sclet-src/bookdown/data/dlpfpc-spatial.rds" "$bookdir/data/"
          cp -f "$ws/sclet-src/bookdown/data/dlpfpc-ref.rds" "$bookdir/data/"

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          path: docs-src
          branch: update-data-spatial
          base: docs
          title: "chore(data): update spatial bookdown caches"
          commit-message: "chore(data): update spatial bookdown caches"
          body: "Update cached spatial data generated from bookdown/data-raw."
          add-paths: |
            bookdown/data/visium-dlpfc-sub.rds
            bookdown/data/dlpfpc-spatial.rds
            bookdown/data/dlpfpc-ref.rds
