name: update-data-spatial

on:
  workflow_dispatch:
  schedule:
    - cron: "20 18 * * 0"

permissions:
  contents: write
  pull-requests: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs branch
        uses: actions/checkout@v4
        with:
          ref: docs
          path: docs-src

      - name: Checkout package source
        uses: actions/checkout@v4
        with:
          ref: devel
          path: sclet-src

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install dependencies
        run: |
          Rscript -e 'install.packages(c("remotes", "BiocManager"))'
          Rscript -e 'BiocManager::install(c("STexampleData", "SpatialExperiment", "SingleCellExperiment", "SummarizedExperiment", "scuttle"), ask = FALSE, update = FALSE)'
          Rscript -e 'remotes::install_github(c("YuLab-SMU/ggsc", "YuLab-SMU/yulab.utils", "YuLab-SMU/fanyi"), upgrade = "never")'
          Rscript -e 'remotes::install_deps("sclet-src", dependencies = c("Depends", "Imports", "LinkingTo"), upgrade = "never")'
          R CMD INSTALL sclet-src

      - name: Build spatial caches
        working-directory: docs-src/bookdown/data-raw
        run: |
          Rscript -e 'source("../../../../sclet-src/bookdown/data-raw/visium-dlpfc-spatial.R")'
          Rscript -e 'source("../../../../sclet-src/bookdown/data-raw/cell2location-paired.R")'

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          path: docs-src
          branch: update-data-spatial
          base: docs
          title: "chore(data): update spatial bookdown caches"
          commit-message: "chore(data): update spatial bookdown caches"
          body: "Update cached spatial data generated from bookdown/data-raw."
          add-paths: |
            bookdown/data/visium-dlpfc-sub.rds
            bookdown/data/dlpfpc-spatial.rds
            bookdown/data/dlpfpc-ref.rds
