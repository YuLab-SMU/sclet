name: update-data-template

on:
  workflow_call:
    inputs:
      run_scripts:
        required: true
        type: string
      add_paths:
        required: true
        type: string
      branch:
        required: true
        type: string
      title:
        required: true
        type: string
      body:
        required: true
        type: string
      bioc_packages:
        required: false
        type: string
        default: ""
      install_sclet:
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    concurrency:
      group: update-data-${{ inputs.branch }}
      cancel-in-progress: false
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      BIOC_PACKAGES: ${{ inputs.bioc_packages }}
    steps:
      - name: Checkout docs branch
        uses: actions/checkout@v4
        with:
          ref: docs
          path: docs-src

      - name: Checkout package source
        uses: actions/checkout@v4
        with:
          ref: devel
          path: sclet-src

      - name: Checkout CI-updated data branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          path: data-src
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            liblz4-dev \
            libzstd-dev \
            zlib1g-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev \
            libcairo2-dev \
            libbz2-dev \
            liblzma-dev \
            libmagick++-dev \
            libhdf5-dev
          if ! ldconfig -p | grep -q 'libglpk\.so\.40'; then
            sudo apt-get install -y libglpk40 || sudo apt-get install -y libglpk40t64 || sudo apt-get install -y libglpk-dev
          fi

      - name: Install R bootstrap dependencies
        run: Rscript -e 'install.packages(c("remotes", "BiocManager"))'

      - name: Install common sclet dependencies
        if: ${{ inputs.install_sclet }}
        run: |
          Rscript -e 'BiocManager::install(c("Rhdf5lib", "rhdf5filters", "rhdf5", "h5mread", "HDF5Array", "bluster", "DropletUtils", "SingleCellExperiment", "SummarizedExperiment", "scuttle", "scran", "scater", "scrapper", "BiocNeighbors"), ask = FALSE, update = FALSE, dependencies = TRUE)'
          Rscript -e 'remotes::install_github(c("YuLab-SMU/ggsc", "YuLab-SMU/yulab.utils", "YuLab-SMU/fanyi"), upgrade = "never")'

      - name: Install extra Bioconductor dependencies
        if: ${{ inputs.bioc_packages != '' }}
        run: |
          Rscript -e 'pkgs <- strsplit(Sys.getenv("BIOC_PACKAGES"), ",", fixed = TRUE)[[1]]; pkgs <- trimws(pkgs); BiocManager::install(pkgs[nzchar(pkgs)], ask = FALSE, update = FALSE, dependencies = TRUE)'

      - name: Install sclet
        if: ${{ inputs.install_sclet }}
        run: |
          cp sclet-src/DESCRIPTION sclet-src/DESCRIPTION.orig
          Rscript -e 'd <- read.dcf("sclet-src/DESCRIPTION"); d[, "Remotes"] <- NA; write.dcf(d, "sclet-src/DESCRIPTION")'
          Rscript -e 'remotes::install_deps("sclet-src", dependencies = c("Depends", "Imports", "LinkingTo"), upgrade = "never")'
          mv sclet-src/DESCRIPTION.orig sclet-src/DESCRIPTION
          R CMD INSTALL sclet-src

      - name: Build cached data
        run: |
          set -euo pipefail
          ws="$GITHUB_WORKSPACE"
          bookdown_yml=$(find "$ws/docs-src" -maxdepth 6 -name '_bookdown.yml' -print -quit)
          if [ -z "$bookdown_yml" ]; then
            echo "No _bookdown.yml found in docs branch checkout." >&2
            exit 1
          fi
          bookdir=$(dirname "$bookdown_yml")
          mkdir -p "$bookdir/data"
          cd "$bookdir/data-raw"
          ${{ inputs.run_scripts }}
          git -C "$ws/docs-src" status --short

      - name: Commit CI-updated data
        shell: bash
        run: |
          set -euo pipefail
          ws="$GITHUB_WORKSPACE"
          cd "$ws/docs-src"
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            mkdir -p "$ws/data-src/$(dirname "$path")"
            cp -a "$path" "$ws/data-src/$path"
          done <<'EOF'
          ${{ inputs.add_paths }}
          EOF
          cd "$ws/data-src"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            git add "$path"
          done <<'EOF'
          ${{ inputs.add_paths }}
          EOF
          if git diff --cached --quiet; then
            echo "No CI-updated data changes to commit."
            exit 0
          fi
          git commit -m "${{ inputs.title }}"
          git fetch origin "${{ inputs.branch }}"
          git rebase "origin/${{ inputs.branch }}"
          git push origin HEAD:${{ inputs.branch }}
