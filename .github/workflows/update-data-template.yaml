name: update-data-template

on:
  workflow_call:
    inputs:
      run_scripts:
        required: true
        type: string
      add_paths:
        required: true
        type: string
      branch:
        required: true
        type: string
      title:
        required: true
        type: string
      body:
        required: true
        type: string
      bioc_packages:
        required: false
        type: string
        default: ""
      install_sclet:
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      BIOC_PACKAGES: ${{ inputs.bioc_packages }}
    steps:
      - name: Checkout docs branch
        uses: actions/checkout@v4
        with:
          ref: docs
          path: docs-src

      - name: Checkout package source
        uses: actions/checkout@v4
        with:
          ref: devel
          path: sclet-src

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libhdf5-dev \
            libpng-dev \
            libjpeg-dev \
            libtiff5-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libglpk-dev
          sudo apt-get install -y libglpk40t64 || sudo apt-get install -y libglpk40 || true
          sudo ldconfig
          ldconfig -p | grep -E 'libglpk\.so' || true

      - name: Install R bootstrap dependencies
        run: Rscript -e 'install.packages(c("remotes", "BiocManager"))'

      - name: Install common sclet dependencies
        if: ${{ inputs.install_sclet }}
        run: |
          Rscript -e 'BiocManager::install(c("Rhdf5lib", "rhdf5filters", "rhdf5", "h5mread", "HDF5Array", "bluster", "DropletUtils", "SingleCellExperiment", "SummarizedExperiment", "scuttle", "scran", "scater", "scrapper", "BiocNeighbors"), ask = FALSE, update = FALSE, dependencies = TRUE)'
          Rscript -e 'remotes::install_github(c("YuLab-SMU/ggsc", "YuLab-SMU/yulab.utils", "YuLab-SMU/fanyi"), upgrade = "never")'

      - name: Install extra Bioconductor dependencies
        if: ${{ inputs.bioc_packages != '' }}
        run: |
          Rscript -e 'pkgs <- strsplit(Sys.getenv("BIOC_PACKAGES"), ",", fixed = TRUE)[[1]]; pkgs <- trimws(pkgs); BiocManager::install(pkgs[nzchar(pkgs)], ask = FALSE, update = FALSE, dependencies = TRUE)'

      - name: Install sclet
        if: ${{ inputs.install_sclet }}
        run: |
          Rscript -e 'remotes::install_deps("sclet-src", dependencies = c("Depends", "Imports", "LinkingTo"), upgrade = "never")'
          R CMD INSTALL sclet-src

      - name: Build cached data
        run: |
          set -euo pipefail
          ws="$GITHUB_WORKSPACE"
          bookdown_yml=$(find "$ws/docs-src" -maxdepth 6 -name '_bookdown.yml' -print -quit)
          if [ -z "$bookdown_yml" ]; then
            echo "No _bookdown.yml found in docs branch checkout." >&2
            exit 1
          fi
          bookdir=$(dirname "$bookdown_yml")
          mkdir -p "$bookdir/data"
          cd "$bookdir/data-raw"
          ${{ inputs.run_scripts }}
          git -C "$ws/docs-src" status --short

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ env.GITHUB_PAT }}
          path: docs-src
          branch: ${{ inputs.branch }}
          base: docs
          title: ${{ inputs.title }}
          commit-message: ${{ inputs.title }}
          body: ${{ inputs.body }}
          add-paths: ${{ inputs.add_paths }}
