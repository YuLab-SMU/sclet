name: update-data-pbmc

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 0"

permissions:
  contents: write
  pull-requests: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs branch
        uses: actions/checkout@v4
        with:
          ref: docs
          path: docs-src

      - name: Checkout package source
        uses: actions/checkout@v4
        with:
          ref: devel
          path: sclet-src

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install dependencies
        run: |
          Rscript -e 'install.packages(c("remotes", "BiocManager"))'
          Rscript -e 'BiocManager::install(c("TENxPBMCData", "SingleCellExperiment", "SummarizedExperiment", "scuttle", "scran", "BiocNeighbors", "bluster"), ask = FALSE, update = FALSE)'
          Rscript -e 'remotes::install_github(c("YuLab-SMU/ggsc", "YuLab-SMU/yulab.utils", "YuLab-SMU/fanyi"), upgrade = "never")'
          Rscript -e 'remotes::install_deps("sclet-src", dependencies = c("Depends", "Imports", "LinkingTo"), upgrade = "never")'
          R CMD INSTALL sclet-src

      - name: Build PBMC cache
        working-directory: docs-src/bookdown/data-raw
        run: Rscript -e 'source("pbmc-3k-sce.R")'

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          path: docs-src
          branch: update-data-pbmc
          base: docs
          title: "chore(data): update PBMC bookdown cache"
          commit-message: "chore(data): update PBMC bookdown cache"
          body: "Update cached PBMC data generated from bookdown/data-raw/pbmc-3k-sce.R."
          add-paths: |
            bookdown/data/pbmc-3k-sce.rds
