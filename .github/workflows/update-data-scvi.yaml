name: update-data-scvi

on:
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * 0"

permissions:
  contents: write
  pull-requests: write

jobs:
  update-data:
    uses: ./.github/workflows/update-data-template.yaml
    secrets: inherit
    with:
      run_scripts: |
        Rscript -e 'source("pbmc-scvi.R")'
      bioc_packages: "TENxPBMCData,basilisk,reticulate,zellkonverter"
      add_paths: |
        data/rm_scvi_pbmc.rds
      branch: update-data-scvi
      title: "chore(data): update scVI integration cache"
      body: "Update cached scVI integration output generated from bookdown/data-raw/pbmc-scvi.R."
