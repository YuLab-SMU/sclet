# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches:
      - devel
  pull_request:
    branches:
      - devel

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }}, Bioc ${{ matrix.config.bioc }})

    strategy:
      fail-fast: false
      matrix:
        config:
          # The four cells BiocCheck/Bioc submission expects. A single
          # ubuntu+release cell is not a check matrix: it cannot catch a
          # platform-only failure, and it says nothing about whether the
          # package installs against Bioc devel rather than the release.
          # Pin the Ubuntu version instead of `ubuntu-latest`: that label is
          # migrating to 26.04 during October-November 2026 (actions/runner-
          # images#14748), and on 26.04 pak's system-requirement install hangs
          # -- `apt-get update` stops mid-download and the job sits there for
          # over an hour with no output (runs 39943697138, 39950678658,
          # 39958711362). 24.04 is where this matrix has been green.
          - {os: ubuntu-24.04,   r: 'release', bioc: 'release'}
          - {os: ubuntu-24.04,   r: 'devel',   bioc: 'devel'}
          - {os: macos-latest,   r: 'release', bioc: 'release'}
          - {os: windows-latest, r: 'release', bioc: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # 53 Suggests packages, most of them heavy optional backends (infercnv,
      # CellChat, SCENIC, scVI, Augur, ...). Forcing them all would make the
      # matrix fail on an unrelated backend's install, not on this package.
      # The backends that DO install are still exercised -- the package's
      # own tests skip what is absent.
      _R_CHECK_FORCE_SUGGESTS_: false

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - name: Give R room to build (Linux)
        # The Bioc devel cell has no binaries on most platforms, so it compiles
        # from source: 416 packages against 112 on the release cell. That fills
        # the runner's root filesystem, and the build dies mid-write with
        #   Error in lazyLoadDBinsertValue(...): write failed
        # which names no cause, since there is no ENOSPC message at that layer.
        # /mnt is the large disk on these runners; point R's temp there.
        if: runner.os == 'Linux'
        run: |
          df -h /tmp /mnt || true
          sudo mkdir -p /mnt/r-tmp
          sudo chmod 777 /mnt/r-tmp
          {
            echo "TMPDIR=/mnt/r-tmp"
          } >> "$GITHUB_ENV"
          # Print what R will actually use, so the next failure cannot hide it.
          Rscript -e 'cat("R tempdir:", tempdir(), "\n")'

      - name: Point the macOS build at Homebrew OpenSSL
        # Apple ships LibreSSL, whose libraries are named libtls/libcrypto but
        # NOT libssl.dylib. Rhdf5lib's libhdf5.a records the HDF5 link line
        # `-lsz -lm -ldl -lcurl -lssl -lcrypto -lz`, so anything linking it from
        # source needs a real libssl to resolve -- which is only true for the
        # Homebrew OpenSSL. alabaster.base is the one package in this tree with
        # no arm64 binary, so it compiles from source and hits exactly this:
        #   ld: library 'ssl' not found
        # -lcurl resolves (macOS bundles libcurl), so OpenSSL is the only gap.
        # The prefix is looked up rather than hardcoded; the brew prefixes move
        # between runner images.
        if: runner.os == 'macOS'
        run: |
          openssl_prefix="$(brew --prefix openssl@1.1 2>/dev/null || brew --prefix openssl)"
          echo "OpenSSL prefix: $openssl_prefix"
          test -e "$openssl_prefix/lib/libssl.dylib" || {
            echo "no libssl.dylib under $openssl_prefix/lib" >&2; exit 1; }
          # ~/.R/Makevars is the injection point R guarantees: Makeconf's own
          # LDFLAGS is baked in and does not inherit the environment, so setting
          # `LDFLAGS=` in GITHUB_ENV alone may never reach a package build.
          mkdir -p "$HOME/.R"
          {
            echo "# resolve the -lssl -lcrypto that Rhdf5lib's libhdf5.a records"
            echo "LDFLAGS += -L$openssl_prefix/lib"
            echo "CPPFLAGS += -I$openssl_prefix/include"
          } >> "$HOME/.R/Makevars"
          cat "$HOME/.R/Makevars"

      - name: Install XQuartz (macOS)
        # nichenetr is in Suggests with a Remotes: entry, so pak builds it from
        # source, and it pulls gdtools. The gdtools arm64 binary itself links
        # /opt/X11/lib/libXrender.1.dylib, which is absent on the runner:
        #   unable to load shared object gdtools.so
        #   Library not loaded: /opt/X11/lib/libXrender.1.dylib
        # XQuartz installs to exactly that path, so it is what the binary wants.
        if: runner.os == 'macOS'
        run: |
          pkg="$RUNNER_TEMP/XQuartz.pkg"
          curl -sSL --retry 3 --retry-delay 5 \
            -o "$pkg" \
            "https://github.com/XQuartz/XQuartz/releases/download/XQuartz-2.8.6/XQuartz-2.8.6.pkg"
          sudo installer -pkg "$pkg" -target /
          test -e /opt/X11/lib/libXrender.1.dylib && echo "libXrender present"

      - name: Install JAGS (Windows)
        # infercnv is in Suggests and on CRAN only, so pak builds it from
        # source; its dependency rjags declares `SystemRequirements: JAGS` and
        # fails at .onLoad with "Failed to locate any version of JAGS version 4".
        # pak installs system requirements on Linux only, so on Windows this
        # has to happen before setup-r-dependencies, not after it.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # SourceForge answers every request from a GitHub runner with its
          # interstitial HTML page (~144 KB, mirror picker, no binary) -- the
          # bare URL, the `/download` URL and a direct mirror host all came back
          # as HTML, so the download cannot be trusted to work from CI at all.
          # Hence the committed copy, checked against a hash measured from a
          # download that did return the real 29,014,264-byte installer.
          $sha256 = "197f3b32f35462fdbbb566035f459bade6c61207fb2bada265be1504c0fa414f"
          $installer = "$env:RUNNER_TEMP\jags.exe"
          Copy-Item ".github/ci-assets/JAGS-4.3.2.exe" $installer
          $actual = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $sha256) {
            throw "JAGS installer hash mismatch: got $actual"
          }
          # Extract rather than run /S. rjags does not search PATH: its
          # .onLoad looks at JAGS_HOME and then at the registry entry the real
          # installer would write. Extracting writes no registry entry, so
          # JAGS_HOME is what makes it findable.
          $jags = "$env:RUNNER_TEMP\JAGS-4.3.2"
          New-Item -ItemType Directory -Force -Path $jags | Out-Null
          7z x $installer "-o$jags" -y | Select-Object -Last 3
          if (-not (Test-Path "$jags\x64\bin\libjags-4.dll")) {
            throw "libjags-4.dll missing after extraction"
          }
          "JAGS_HOME=$jags" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "$jags\x64\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install Python argparse (Windows)
        # infercnv imports argparse, whose .onLoad requires the *Python* module
        # of the same name (`required_modules = c("argparse", "json |
        # simplejson")`), and the runner's Python does not ship it, so building
        # infercnv died with "Couldn't find a sufficient Python binary".
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check argparse
          python -c "import argparse, json; print('argparse ok', argparse.__version__)"
          # findpython tries getOption("python_cmd"), then PYTHON, then the
          # python*/python3.* names on PATH. Pin the interpreter we just
          # installed into explicitly, so the module and the binary that R
          # probes cannot diverge.
          $python = (Get-Command python).Source
          "PYTHON=$python" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Host "PYTHON=$python"

      - name: Make apt survive a slow mirror (Linux)
        # pak installs system requirements itself (`pre_install: apt-get -y
        # update`) and on Ubuntu 26.04 those downloads stalled outright: three
        # runs stopped mid-transfer with no output for 60-119 minutes, each on
        # a different package, and neither Retries nor Timeout rescued them
        # because the stall happens after the connection is established.
        # 26.04 is also the label `ubuntu-latest` is migrating to
        # (actions/runner-images#14748), so the matrix pins 24.04 now. These
        # options still help on 24.04, where the same 300+ package fetch is
        # merely very slow (a release cell sat in `apt-get` for 36+ minutes).
        if: runner.os == 'Linux'
        run: |
          sudo tee /etc/apt/apt.conf.d/99-ci-retries >/dev/null <<'EOF'
          Acquire::Retries "5";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          Acquire::http::Pipeline-Depth "0";
          EOF
          cat /etc/apt/apt.conf.d/99-ci-retries

      - name: Install the Python runtime libraries (Linux)
        # basilisk builds its venvs with the pyenv Python that reticulate
        # installs on demand, and that build resolves the host's libffi and
        # readline. On the ubuntu runners both are absent, so the interpreter
        # cannot import `_ctypes` ("undefined symbol: _PyErr_SetLocaleString")
        # or `readline`, and the velociraptor environment fails before any
        # scvelo code runs. Measured 2026-10-23 in run 39908066231: every
        # velocity test then reports the backend's verbatim message.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libffi-dev libreadline-dev
          # Fail loudly rather than silently producing a broken interpreter:
          # the step that consumes these runs after reticulate may have
          # already built its pyenv, so verify what the runner ships.
          dpkg -l libffi8 libreadline8 | tail -2

      - name: Pre-install the system requirements pak would fetch (Linux)
        # pak resolves sysreqs itself and its `apt-get install` pulls 300+
        # packages in one shot (libgdal-dev alone drags in most of them). On
        # these runners that single call is where the cell spends its time or
        # hangs: a release cell sat inside it for 36+ minutes, and on 26.04 it
        # stalled outright. Doing it here instead means it is timed on its own,
        # the retry is explicit, and pak afterwards finds everything present
        # and issues no apt call at all.
        # The list is pak's own for this DESCRIPTION's Suggests; regenerate with
        #   pak::pkg_sysreqs(pak::pkg_deps("deps::."))
        # if the Suggests list changes.
        if: runner.os == 'Linux'
        run: |
          sysreqs=(
            python3 libcurl4-openssl-dev libssl-dev cmake make libuv1-dev
            libcairo2-dev libfontconfig1-dev libfreetype6-dev perl
            libpng-dev zlib1g-dev libglpk-dev libxml2-dev pandoc
            libmagick++-dev gsfonts jags libicu-dev libnode-dev
            libbz2-dev liblzma-dev libfribidi-dev libharfbuzz-dev
            libx11-dev libgdal-dev gdal-bin libgeos-dev libglu1-mesa-dev
            libgmp3-dev libgsl0-dev libmpfr-dev libopenmpi-dev
            libproj-dev libjpeg-dev libtiff-dev libwebp-dev
          )
          sudo apt-get update
          # Two passes: the first may stall on a slow mirror mid-stream, and a
          # second re-runs so whatever is left gets installed. apt is
          # idempotent, so a clean first pass makes the second a no-op.
          sudo apt-get install -y --no-install-recommends "${sysreqs[@]}" \
            || sudo apt-get install -y --no-install-recommends "${sysreqs[@]}"
          # Spot-check the libraries the R build links against.
          pkg-config --modversion gdal openssl libcurl 2>/dev/null || true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::BiocManager
          needs: check

      - name: Pin Bioconductor ${{ matrix.config.bioc }}
        # `version = "release"` is not a valid argument: only a numeric version
        # (e.g. "3.22") or the literal "devel" are accepted, and BiocManager
        # rejects anything else with `invalid version specification`. Resolve
        # the tag to a number here instead of passing the tag through.
        # R's release already ships the matching BiocVersion, so `version()`
        # is the number to pin for that row; `devel` is passed through as-is.
        run: |
          bioc <- "${{ matrix.config.bioc }}"
          version <- if (identical(bioc, "devel")) "devel" else as.character(BiocManager::version())
          message("Pinning Bioconductor ", bioc, " -> version ", version)
          BiocManager::install(version = version, ask = FALSE, update = FALSE)
        shell: Rscript {0}

      - name: Install GitHub remotes
        # These four are in Suggests and have no Bioconductor release, so
        # setup-r-dependencies cannot place them. The package's own code
        # requireNamespace()s them, so a missing one changes behaviour.
        run: |
          install.packages('remotes')
          remotes::install_github("saeyslab/nichenetr")
          remotes::install_github("neurorestore/Augur")
          remotes::install_github(c("immunogenomics/harmony", "immunogenomics/symphony"))
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          error-on: '"error"'
          # `args` already defaults to c("--no-manual", "--as-cran"). The old
          # `checkargs` key is not an input this action accepts ("Unexpected
          # input(s) 'checkargs'"), so it never had any effect.
