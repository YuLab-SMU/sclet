# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches:
      - devel
  pull_request:
    branches:
      - devel

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }}, Bioc ${{ matrix.config.bioc }})

    strategy:
      fail-fast: false
      matrix:
        config:
          # The four cells BiocCheck/Bioc submission expects. A single
          # ubuntu+release cell is not a check matrix: it cannot catch a
          # platform-only failure, and it says nothing about whether the
          # package installs against Bioc devel rather than the release.
          - {os: ubuntu-latest,  r: 'release', bioc: 'release'}
          - {os: ubuntu-latest,  r: 'devel',   bioc: 'devel'}
          - {os: macos-latest,   r: 'release', bioc: 'release'}
          - {os: windows-latest, r: 'release', bioc: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # 53 Suggests packages, most of them heavy optional backends (infercnv,
      # CellChat, SCENIC, scVI, Augur, ...). Forcing them all would make the
      # matrix fail on an unrelated backend's install, not on this package.
      # The backends that DO install are still exercised -- the package's
      # own tests skip what is absent.
      _R_CHECK_FORCE_SUGGESTS_: false

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - name: Install JAGS (Windows)
        # infercnv is in Suggests and on CRAN only, so pak builds it from
        # source; its dependency rjags declares `SystemRequirements: JAGS` and
        # fails at .onLoad with "Failed to locate any version of JAGS version 4".
        # pak installs system requirements on Linux only, so on Windows this
        # has to happen before setup-r-dependencies, not after it.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # SourceForge answers every request from a GitHub runner with its
          # interstitial HTML page (~144 KB, mirror picker, no binary) -- the
          # bare URL, the `/download` URL and a direct mirror host all came back
          # as HTML, so the download cannot be trusted to work from CI at all.
          # Hence the committed copy, checked against a hash measured from a
          # download that did return the real 29,014,264-byte installer.
          $sha256 = "197f3b32f35462fdbbb566035f459bade6c61207fb2bada265be1504c0fa414f"
          $installer = "$env:RUNNER_TEMP\jags.exe"
          Copy-Item ".github/ci-assets/JAGS-4.3.2.exe" $installer
          $actual = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $sha256) {
            throw "JAGS installer hash mismatch: got $actual"
          }
          # Extract rather than run /S. rjags hardcodes the install location it
          # probes (C:\Program Files\JAGS\JAGS-4.3.2\x64), so keeping that name
          # is what makes the DLL findable; extracting also avoids depending on
          # the silent switch.
          $jags = "C:\Program Files\JAGS\JAGS-4.3.2"
          New-Item -ItemType Directory -Force -Path $jags | Out-Null
          7z x $installer "-o$jags" -y | Select-Object -Last 3
          # jags-terminal has no --version flag ("Unable to open command file
          # --version"), so assert on the library itself, which is what rjags
          # actually loads.
          if (-not (Test-Path "$jags\x64\bin\libjags-4.dll")) {
            throw "libjags-4.dll missing after extraction"
          }
          "$jags\x64\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::BiocManager
          needs: check

      - name: Pin Bioconductor ${{ matrix.config.bioc }}
        # `version = "release"` is not a valid argument: only a numeric version
        # (e.g. "3.22") or the literal "devel" are accepted, and BiocManager
        # rejects anything else with `invalid version specification`. Resolve
        # the tag to a number here instead of passing the tag through.
        # R's release already ships the matching BiocVersion, so `version()`
        # is the number to pin for that row; `devel` is passed through as-is.
        run: |
          bioc <- "${{ matrix.config.bioc }}"
          version <- if (identical(bioc, "devel")) "devel" else as.character(BiocManager::version())
          message("Pinning Bioconductor ", bioc, " -> version ", version)
          BiocManager::install(version = version, ask = FALSE, update = FALSE)
        shell: Rscript {0}

      - name: Install GitHub remotes
        # These four are in Suggests and have no Bioconductor release, so
        # setup-r-dependencies cannot place them. The package's own code
        # requireNamespace()s them, so a missing one changes behaviour.
        run: |
          install.packages('remotes')
          remotes::install_github("saeyslab/nichenetr")
          remotes::install_github("neurorestore/Augur")
          remotes::install_github(c("immunogenomics/harmony", "immunogenomics/symphony"))
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          error-on: '"error"'
          checkargs: 'c("--no-manual", "--as-cran")'
