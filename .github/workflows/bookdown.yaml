name: bookdown

on:
  push:
    branches:
      - docs
      - devel

permissions:
  contents: write

concurrency:
  group: bookdown-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      SCLET_BOOKDOWN_EVAL: "true"

    steps:
      - name: Checkout docs branch
        uses: actions/checkout@v4
        with:
          ref: docs
          path: docs-src

      - name: Checkout package source (devel)
        uses: actions/checkout@v4
        with:
          ref: devel
          path: sclet-src

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            liblz4-dev \
            libzstd-dev \
            zlib1g-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev \
            libcairo2-dev \
            libbz2-dev \
            liblzma-dev \
            libmagick++-dev
          if ! ldconfig -p | grep -q 'libglpk\.so\.40'; then
            sudo apt-get install -y libglpk40 || sudo apt-get install -y libglpk40t64 || sudo apt-get install -y libglpk-dev
          fi

      - name: Install dependencies
        run: |
          Rscript -e 'install.packages(c("remotes","BiocManager"))'
          Rscript -e 'install.packages("fs")'
          Rscript -e 'install.packages(c("bookdown","rmarkdown","knitr"))'
          Rscript -e 'stopifnot(requireNamespace("bookdown", quietly = TRUE), requireNamespace("rmarkdown", quietly = TRUE), requireNamespace("knitr", quietly = TRUE))'
          Rscript -e 'install.packages(c("shadowtext","conflicted","aplot","ggplot2","pkgbuild","patchwork","gdtools","NMF","circlize"))'
          Rscript -e 'BiocManager::install("YuLab-SMU/ggtree", ask = FALSE, update = FALSE)'
          Rscript -e 'BiocManager::install("clusterProfiler", ask = FALSE, update = TRUE, force = TRUE)'
          Rscript -e 'stopifnot(requireNamespace("clusterProfiler", quietly = TRUE))'
          Rscript -e 'BiocManager::install(c("ensembldb", "AnnotationHub"), ask = FALSE, update = TRUE, force = TRUE)'
          Rscript -e 'stopifnot(requireNamespace("ensembldb", quietly = TRUE))'
          Rscript -e 'BiocManager::install("SpatialExperiment", ask = FALSE, update = FALSE, force = TRUE)'
          Rscript -e 'stopifnot(requireNamespace("SpatialExperiment", quietly = TRUE))'
          Rscript -e 'BiocManager::install(c("AUCell", "GSVA", "UCell", "zellkonverter"), ask = FALSE, update = FALSE)'
          Rscript -e 'BiocManager::install(c("scater","scran","scrapper","scuttle","TENxPBMCData","MouseThymusAgeing","SingleR","celldex","DropletUtils","SingleCellExperiment","SummarizedExperiment","velociraptor","enrichplot","org.Mm.eg.db","org.Hs.eg.db","org.Rn.eg.db","batchelor","iSEE","slingshot","miloR","ComplexHeatmap","harmony","scDblFinder","celda","destiny","BiocNeighbors","DESeq2"), ask = FALSE, update = FALSE)'
          Rscript -e 'stopifnot(requireNamespace("scrapper", quietly = TRUE), requireNamespace("TENxPBMCData", quietly = TRUE), requireNamespace("SingleCellExperiment", quietly = TRUE), requireNamespace("BiocNeighbors", quietly = TRUE), requireNamespace("DESeq2", quietly = TRUE))'
          Rscript -e 'install.packages("symphony", repos = "https://cloud.r-project.org")'
          Rscript -e 'stopifnot(requireNamespace("symphony", quietly = TRUE))'
          Rscript -e 'remotes::install_github(c("immunogenomics/presto", "GfellerLab/SuperCell", "jinworks/CellChat", "YuLab-SMU/aisdk", "YuLab-SMU/ggsc", "YuLab-SMU/yulab.utils", "YuLab-SMU/fanyi", "KlugerLab/ALRA", "aiminXie/scPAS", "neurorestore/Augur"), upgrade = "never")'
          Rscript -e 'stopifnot(requireNamespace("CellChat", quietly = TRUE))'
          Rscript -e 'remotes::install_deps("sclet-src", dependencies = c("Depends","Imports","LinkingTo"), upgrade = "never")'
          R CMD INSTALL sclet-src
          Rscript -e 'stopifnot(requireNamespace("sclet", quietly = TRUE))'

      - name: Pull cached book data
        working-directory: docs-src/bookdown
        run: |
          mkdir -p data
          cp -f ../../sclet-src/bookdown/data/*.rds data/ 2>/dev/null || true
          cp -f ../../sclet-src/bookdown/data/*.txt data/ 2>/dev/null || true
          cp -f ../../sclet-src/bookdown/data/*.tbl data/ 2>/dev/null || true
          cp -f ../../sclet-src/bookdown/data/*.csv data/ 2>/dev/null || true

      - name: Detect book directory
        shell: bash
        run: |
          set -euo pipefail
          BOOKDOWN_YML=$(find docs-src -maxdepth 6 -name '_bookdown.yml' -print -quit || true)
          if [ -z "$BOOKDOWN_YML" ]; then
            echo "No _bookdown.yml found in docs branch checkout (docs-src)." >&2
            echo "docs-src top-level contents:" >&2
            ls -la docs-src >&2
            exit 1
          fi
          BOOKDIR=$(dirname "$BOOKDOWN_YML")
          echo "BOOKDIR=$BOOKDIR" >> "$GITHUB_ENV"
          if [ ! -f "$BOOKDIR/index.Rmd" ]; then
            echo "No index.Rmd found under $BOOKDIR" >&2
            ls -la "$BOOKDIR" >&2
            exit 1
          fi

      - name: Build site
        run: |
          Rscript -e '
            ws <- Sys.getenv("GITHUB_WORKSPACE")
            bookdir <- Sys.getenv("BOOKDIR")
            bookdir_abs <- normalizePath(file.path(ws, bookdir), mustWork = TRUE)
            outdir <- file.path(ws, "site")
            dir.create(outdir, recursive = TRUE, showWarnings = FALSE)
            setwd(bookdir_abs)
            bookdown::render_book("index.Rmd", output_format = "bookdown::gitbook", output_dir = outdir, new_session = TRUE)
          '

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
