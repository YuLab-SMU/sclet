name: bookdown

on:
  push:
    branches:
      - docs
      - devel

permissions:
  contents: write

concurrency:
  group: bookdown-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      SCLET_BOOKDOWN_EVAL: "true"

    steps:
      - name: Checkout docs branch
        uses: actions/checkout@v4
        with:
          ref: docs
          path: docs-src

      - name: Checkout package source (devel)
        uses: actions/checkout@v4
        with:
          ref: devel
          path: sclet-src

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            liblz4-dev \
            libzstd-dev \
            zlib1g-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev \
            libcairo2-dev
          if ! ldconfig -p | grep -q 'libglpk\.so\.40'; then
            sudo apt-get install -y libglpk40 || sudo apt-get install -y libglpk40t64 || sudo apt-get install -y libglpk-dev
          fi

      - name: Install dependencies
        run: |
          Rscript -e 'install.packages(c("remotes","BiocManager"))'
          Rscript -e 'options(repos = c(CRAN = "https://cloud.r-project.org")); install.packages(c("bookdown","rmarkdown","knitr","qs","shadowtext","conflicted","aplot","ggplot2","ggsc","yulab.utils","pkgbuild","patchwork","gdtools"))'
          Rscript -e 'options(repos = c(CRAN = "https://cloud.r-project.org")); if (!requireNamespace("qs", quietly = TRUE)) remotes::install_github("qsbase/qs", upgrade = "never"); stopifnot(requireNamespace("qs", quietly = TRUE))'
          Rscript -e 'BiocManager::install("YuLab-SMU/ggtree", ask = FALSE, update = FALSE)'
          Rscript -e 'BiocManager::install("clusterProfiler", ask = FALSE, update = TRUE, force = TRUE)'
          Rscript -e 'stopifnot(requireNamespace("clusterProfiler", quietly = TRUE))'
          Rscript -e 'BiocManager::install(c("scater","scran","scuttle","TENxPBMCData","scRNAseq","MouseThymusAgeing","SingleR","celldex","DropletUtils","SingleCellExperiment","SummarizedExperiment","velociraptor","SpatialExperiment","enrichplot","org.Mm.eg.db","org.Hs.eg.db","batchelor","iSEE","slingshot","miloR"), ask = FALSE, update = FALSE)'
          Rscript -e 'remotes::install_github(c("immunogenomics/presto", "GfellerLab/SuperCell"), upgrade = "never")'
          Rscript -e 'remotes::install_deps("sclet-src", dependencies = c("Depends","Imports","LinkingTo"), upgrade = "never")'
          R CMD INSTALL sclet-src
          Rscript -e 'stopifnot(requireNamespace("sclet", quietly = TRUE))'

      - name: Detect book directory
        shell: bash
        run: |
          set -euo pipefail
          BOOKDOWN_YML=$(find docs-src -maxdepth 6 -name '_bookdown.yml' -print -quit || true)
          if [ -z "$BOOKDOWN_YML" ]; then
            echo "No _bookdown.yml found in docs branch checkout (docs-src)." >&2
            echo "docs-src top-level contents:" >&2
            ls -la docs-src >&2
            exit 1
          fi
          BOOKDIR=$(dirname "$BOOKDOWN_YML")
          echo "BOOKDIR=$BOOKDIR" >> "$GITHUB_ENV"
          if [ ! -f "$BOOKDIR/index.Rmd" ]; then
            echo "No index.Rmd found under $BOOKDIR" >&2
            ls -la "$BOOKDIR" >&2
            exit 1
          fi

      - name: Build site
        run: |
          Rscript -e 'ws <- Sys.getenv("GITHUB_WORKSPACE"); bookdir <- Sys.getenv("BOOKDIR"); bookdir_abs <- normalizePath(file.path(ws, bookdir), mustWork = TRUE); outdir <- file.path(ws, "site"); dir.create(outdir, recursive = TRUE, showWarnings = FALSE); setwd(bookdir_abs); bookdown::render_book("index.Rmd", output_dir = outdir)'

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
