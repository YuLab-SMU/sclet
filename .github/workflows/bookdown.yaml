name: bookdown

on:
  push:
    branches:
      - docs

permissions:
  contents: write

concurrency:
  group: bookdown-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Checkout package source (devel)
        uses: actions/checkout@v4
        with:
          ref: devel
          path: sclet-src

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        run: |
          Rscript -e 'install.packages("pak")'
          Rscript -e 'pak::pkg_install(c(
            "bookdown",
            "rmarkdown",
            "knitr",
            "qs",
            "TENxPBMCData",
            "slingshot",
            "SingleR",
            "celldex",
            "shadowtext",
            "scRNAseq",
            "velociraptor",
            "SpatialExperiment",
            "SVP",
            "SuperCell",
            "enrichplot",
            "org.Mm.eg.db",
            "iSEE"
          ))'
          Rscript -e 'pak::pkg_install("jinworks/CellChat")'
          Rscript -e 'pak::pkg_install("local::sclet-src")'

      - name: Detect book directory
        shell: bash
        run: |
          set -euo pipefail
          if [ -f bookdown/_bookdown.yml ]; then
            echo "BOOKDIR=bookdown" >> "$GITHUB_ENV"
          else
            BOOKDOWN_YML=$(find . -maxdepth 6 -name '_bookdown.yml' -print -quit || true)
            if [ -z "$BOOKDOWN_YML" ]; then
              echo "No _bookdown.yml found." >&2
              echo "Top-level contents:" >&2
              ls -la >&2
              exit 1
            fi
            echo "BOOKDIR=$(dirname "$BOOKDOWN_YML")" >> "$GITHUB_ENV"
          fi

      - name: Build site
        run: Rscript -e 'bookdir <- Sys.getenv("BOOKDIR"); ws <- Sys.getenv("GITHUB_WORKSPACE"); outdir <- file.path(ws, "site"); dir.create(outdir, recursive = TRUE, showWarnings = FALSE); bookdown::render_book(file.path(ws, bookdir, "index.Rmd"), output_dir = outdir)'

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
