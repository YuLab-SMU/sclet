on:
  push:
    branches:
      - devel
      - docs

name: bookdown

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v2

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::bookdown
            local::.
          needs: check

      - name: Install package
        run: R CMD INSTALL .

      - name: Detect book source directory
        run: |
          set -e
          BOOKDOWN_YML=$(find . -maxdepth 4 -name '_bookdown.yml' -print -quit)
          if [ -z "$BOOKDOWN_YML" ]; then
            echo "No _bookdown.yml found (searched up to depth 4)." >&2
            exit 1
          fi
          BOOKDOWN_DIR=$(dirname "$BOOKDOWN_YML")
          echo "BOOKDOWN_DIR=$BOOKDOWN_DIR" >> $GITHUB_ENV
          if [ ! -f "$BOOKDOWN_DIR/index.Rmd" ]; then
            echo "No index.Rmd found under $BOOKDOWN_DIR" >&2
            echo "Contents of $BOOKDOWN_DIR:" >&2
            ls -la "$BOOKDOWN_DIR" >&2
            exit 1
          fi

      - name: Build site
        run: |
          rm -rf gh-pages
          Rscript -e 'bookdir <- Sys.getenv("BOOKDOWN_DIR"); outdir <- normalizePath("gh-pages", mustWork = FALSE); dir.create(outdir, recursive = TRUE, showWarnings = FALSE); bookdown::render_book(file.path(bookdir, "index.Rmd"), output_dir = outdir)'

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/docs'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages
          publish_branch: gh-pages
