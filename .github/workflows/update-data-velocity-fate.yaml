name: update-data-velocity-fate

on:
  workflow_dispatch:
  schedule:
    - cron: "40 18 * * 0"

permissions:
  contents: write
  pull-requests: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs branch
        uses: actions/checkout@v4
        with:
          ref: docs
          path: docs-src

      - name: Checkout package source
        uses: actions/checkout@v4
        with:
          ref: devel
          path: sclet-src

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libhdf5-dev libpng-dev libjpeg-dev libtiff5-dev libfreetype6-dev libfontconfig1-dev

      - name: Install R and Python-backed dependencies
        run: |
          Rscript -e 'install.packages(c("remotes", "BiocManager"))'
          Rscript -e 'BiocManager::install(c("basilisk", "reticulate", "velociraptor", "scRNAseq", "SingleCellExperiment", "SummarizedExperiment", "scuttle", "scran", "BiocNeighbors", "bluster", "zellkonverter"), ask = FALSE, update = FALSE)'
          Rscript -e 'remotes::install_github(c("YuLab-SMU/ggsc", "YuLab-SMU/yulab.utils", "YuLab-SMU/fanyi"), upgrade = "never")'
          Rscript -e 'remotes::install_deps("sclet-src", dependencies = c("Depends", "Imports", "LinkingTo"), upgrade = "never")'
          R CMD INSTALL sclet-src

      - name: Build velocity and CellRank caches
        working-directory: docs-src/bookdown/data-raw
        run: |
          Rscript -e 'source("../../../../sclet-src/bookdown/data-raw/hermann-sperm-velo.R")'
          Rscript -e 'source("../../../../sclet-src/bookdown/data-raw/hermann-sperm-dynamics.R")'

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          path: docs-src
          branch: update-data-velocity-fate
          base: docs
          title: "chore(data): update velocity and fate bookdown caches"
          commit-message: "chore(data): update velocity and fate bookdown caches"
          body: "Update cached velocity and CellRank data generated from bookdown/data-raw."
          add-paths: |
            bookdown/data/hermann-sperm-velo.rds
            bookdown/data/hermann-sperm-dynamics.rds
