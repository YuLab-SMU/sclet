name: update-data-velocity-fate

on:
  workflow_dispatch:
  schedule:
    - cron: "40 18 * * 0"

permissions:
  contents: write

jobs:
  update-data:
    uses: ./.github/workflows/update-data-template.yaml
    secrets: inherit
    with:
      run_scripts: |
        Rscript -e 'source("hermann-sperm-velo.R")'
        Rscript -e 'source("hermann-sperm-dynamics.R")'
      bioc_packages: "basilisk,reticulate,velociraptor,scRNAseq,zellkonverter"
      add_paths: |
        data/hermann-sperm-velo.rds
        data/hermann-sperm-dynamics.rds
      branch: ci-update-data
      title: "chore(data): update velocity and fate bookdown caches"
      body: "Update cached velocity and CellRank data generated from bookdown/data-raw."
