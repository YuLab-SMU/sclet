name: update-data-scenic-refs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 19 * * 0"

permissions:
  contents: write

jobs:
  update-data:
    uses: ./.github/workflows/update-data-template.yaml
    secrets: inherit
    with:
      install_sclet: false
      run_scripts: |
        Rscript -e 'source("scenic-refs.R")'
      add_paths: |
        data/allTFs_hg38.txt
        data/motifs-v9-nr.hgnc.tbl
      branch: ci-update-data
      title: "chore(data): update SCENIC reference caches"
      body: "Update cached SCENIC reference files generated from bookdown/data-raw/scenic-refs.R."
